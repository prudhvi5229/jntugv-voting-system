<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCET - Whitelist Voter Registry</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }
        .form-section {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 14px;
        }
        button {
            padding: 12px 20px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background: #0369a1;
        }
        .delete-btn {
            background: #ef4444;
            padding: 6px 12px;
            font-size: 12px;
        }
        .delete-btn:hover {
            background: #dc2626;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #0f172a;
            color: #94a3b8;
        }
        tr:hover {
            background-color: #334155;
        }
        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            display: none;
        }
        .alert-success { background: #15803d; color: white; }
        .alert-error { background: #b91c1c; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>BCET Whitelist Voter Registry Dashboard</h2>
    
    <div id="alertBox" class="alert"></div>

    <!-- Live Add Student Section -->
    <div class="form-section">
        <input type="text" id="new_student_id" placeholder="Student Hall Ticket Number (e.g. 24V11A0522)" required>
        <input type="email" id="new_student_email" placeholder="Registered Email ID" required>
        <button onclick="addStudent()">Add Student</button>
    </div>

    <!-- Whitelisted Students Table -->
    <table>
        <thead>
            <tr>
                <th>Hall Ticket Number</th>
                <th>Registered Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td><strong>{{ student.id }}</strong></td>
                <td>{{ student.email }}</td>
                <td>
                    <button class="delete-btn" onclick="deleteStudent('{{ student.id }}')">Remove</button>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" style="text-align: center; color: #94a3b8;">No students whitelisted in database registry yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    function showAlert(msg, isSuccess) {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerText = msg;
        alertBox.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
        alertBox.style.display = 'block';
        setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }

    function addStudent() {
        const studentId = document.getElementById('new_student_id').value.trim();
        const email = document.getElementById('new_student_email').value.trim();

        if (!studentId || !email) {
            showAlert("Please fill in both Student ID and Email!", false);
            return;
        }

        const formData = new FormData();
        formData.append('student_id', studentId);
        formData.append('email', email);

        fetch('/admin/add_student_live', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                showAlert(data.message, true);
                setTimeout(() => { location.reload(); }, 1000);
            } else {
                showAlert(data.message, false);
            }
        })
        .catch(err => {
            showAlert("Network communication failure!", false);
        });
    }

    function deleteStudent(studentId) {
        if (!confirm("Are you sure you want to delete Student " + studentId + " from whitelist?")) return;

        const formData = new FormData();
        formData.append('student_id', studentId);

        fetch('/admin/delete_student_live', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                showAlert(data.message, true);
                setTimeout(() => { location.reload(); }, 1000);
            } else {
                showAlert(data.message, false);
            }
        })
        .catch(err => {
            showAlert("Network communication failure!", false);
        });
    }
</script>

</body>
</html>
