<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Voter Whitelist Registry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; padding: 40px 20px; }
        .box { max-width: 700px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); }
        h2 { margin-top: 0; color: #10b981; font-weight: 800; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-weight: 600; text-transform: uppercase; }
        button { padding: 12px 20px; border: none; border-radius: 8px; background: #10b981; color: white; font-weight: 700; cursor: pointer; }
        .copy-area-label { font-size: 0.8rem; text-transform: uppercase; color: #3b82f6; font-weight: 800; margin-bottom: 6px; display: block; }
        textarea { width: 100%; height: 200px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #a7f3d0; padding: 14px; font-family: monospace; font-size: 0.95rem; line-height: 1.6; box-sizing: border-box; resize: none; }
        .back-link { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="box">
    <h2>Voter Whitelist Registry Control</h2>
    <p style="color: #94a3b8; font-size: 0.85rem; margin-top: -8px; margin-bottom: 20px;">Inject or copy authorized student nodes dynamically.</p>
    
    <div class="input-group">
        <input type="text" id="sidInput" placeholder="Enter Student ID Matrix (e.g. 24V11A0599)">
        <button onclick="addStudentLive()">Authorize ID</button>
    </div>

    <!-- UPGRADED FOR EASY COPY-PASTE EXPERIENCE -->
    <span class="copy-area-label">📋 Copy-Paste Optimized Whitelist Database Ledger</span>
    <textarea id="whitelistTextArea" readonly onclick="this.select();" title="Click anywhere inside to select all IDs for fast copy-paste">{% for student in students %}{{ student }}
{% endfor %}</textarea>

    <div style="margin-top: 15px; font-size: 0.75rem; color: #64748b;">* Tip: Click anywhere inside the text box above to automatically highlight and select all student hall tickets.</div>

    <a href="/admin-results/{{ secret }}" class="back-link">← Return to Control Dashboard Node</a>
</div>

<script>
function addStudentLive() {
    const val = document.getElementById('sidInput').value.trim();
    if(!val) return;
    let fd = new FormData();
    fd.append('student_id', val);
    fetch('/admin/add_student_live', { method: 'POST', body: fd })
    .then(r => r.json()).then(d => { alert(d.message); window.location.reload(); });
}
</script>
</body>
</html>
