<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCET - Voter Registry</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }
        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        input[type="text"], input[type="email"] {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            padding: 12px 24px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #334155;
            color: #38bdf8;
        }
        tr:hover {
            background-color: #2b394f;
        }
        .btn-delete {
            background-color: #ef4444;
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-delete:hover {
            background-color: #dc2626;
        }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        .success { background-color: #16a34a; color: white; }
        .error { background-color: #dc2626; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>BCET Voter Registry Management Portal</h2>
    
    <div id="alertBox" class="alert"></div>

    <div class="form-group">
        <input type="text" id="studentIdInput" placeholder="Enter Student Roll Number (e.g., 24V11A0522)">
        <input type="email" id="studentEmailInput" placeholder="Enter Student Official Email">
        <button onclick="addStudent()">Add Student Node</button>
    </div>

    <h3>Currently Authorized Whitelist Registry</h3>
    <table>
        <thead>
            <tr>
                <th>Student ID</th>
                <th>Registered Email</th>
                <th>Action Matrix</th>
            </tr>
        </thead>
        <tbody id="voterTableBody">
            {% for student in students %}
            <tr id="row-{{ student.id }}">
                <td><strong>{{ student.id }}</strong></td>
                <td>{{ student.email }}</td>
                <td>
                    <button class="btn-delete" onclick="deleteStudent('{{ student.id }}')">Remove Node</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
function showAlert(message, type) {
    const alertBox = document.getElementById('alertBox');
    alertBox.textContent = message;
    alertBox.className = `alert ${type}`;
    alertBox.style.display = 'block';
    setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
}

function addStudent() {
    const studentId = document.getElementById('studentIdInput').value.trim();
    const email = document.getElementById('studentEmailInput').value.trim();

    if (!studentId || !email) {
        showAlert("Both Student ID and Email fields are strictly required!", "error");
        return;
    }

    fetch('/admin/add_student_live', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: `student_id=${encodeURIComponent(studentId)}&email=${encodeURIComponent(email)}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            showAlert(data.message, "success");
            
            const tbody = document.getElementById('voterTableBody');
            const newRow = document.createElement('tr');
            newRow.id = `row-${studentId.toUpperCase()}`;
            newRow.innerHTML = `
                <td><strong>${studentId.toUpperCase()}</strong></td>
                <td>${email.toLowerCase()}</td>
                <td>
                    <button class="btn-delete" onclick="deleteStudent('${studentId.toUpperCase()}')">Remove Node</button>
                </td>
            `;
            tbody.appendChild(newRow);
            
            document.getElementById('studentIdInput').value = '';
            document.getElementById('studentEmailInput').value = '';
        } else {
            showAlert(data.message, "error");
        }
    })
    .catch(error => showAlert("Network transmission failure!", "error"));
}

function deleteStudent(studentId) {
    if (!confirm(`Are you absolutely sure you want to remove Node [${studentId}]?`)) return;

    fetch('/admin/delete_student_live', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: `student_id=${encodeURIComponent(studentId)}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            showAlert(data.message, "success");
            const row = document.getElementById(`row-${studentId}`);
            if (row) row.remove();
        } else {
            showAlert(data.message, "error");
        }
    })
    .catch(error => showAlert("Network database error.", "error"));
}
</script>

</body>
</html>
