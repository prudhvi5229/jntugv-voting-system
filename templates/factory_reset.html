<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voter Node Factory Reset Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; padding: 40px 20px; }
        .box { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #ef4444; }
        h2 { margin-top: 0; color: #ef4444; font-weight: 800; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-weight: 600; margin-bottom: 16px; box-sizing: border-box; text-transform: uppercase; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #ef4444; color: white; font-weight: 700; cursor: pointer; }
        .back-link { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="box">
    <h2>Voter Node Factory Reset</h2>
    <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px;">
        Use this utility when a student forgets both password and registered email parameters. This action flushes database registration data but preserves whitelist presence, permitting a fresh signup.
    </p>
    <input type="text" id="flushInput" placeholder="Enter target student hall ticket ID">
    <button onclick="executeFlush()">Execute Dangerous Database Profile Wipe</button>
    <br>
    <a href="/admin-results/{{ secret }}" class="back-link">← Cancel and Abort Operation</a>
</div>

<script>
function executeFlush() {
    const target = document.getElementById('flushInput').value.trim();
    if(!target) return;
    if(!confirm("Verify database erasure execution request for: " + target + "?")) return;
    let fd = new FormData();
    fd.append('student_id', target);
    fetch('/admin/execute_node_flush', { method: 'POST', body: fd })
    .then(r => r.json()).then(d => { alert(d.message); if(d.status === "success") window.location.reload(); });
}
</script>
</body>
</html>
